name: bankos_app
description: "BankOs — App de clientes. Una plataforma, todos los bancos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado
  provider: ^6.1.2

  # Red / API
  dio: ^5.4.3+1

  # Almacenamiento seguro (token JWT, credenciales)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # QR
  qr_flutter: ^4.1.0           # Generar QR (en memoria, no se guarda)
  mobile_scanner: ^5.1.1       # Escanear QR con la cámara

  # Correo simulado / certificado
  pdf: ^3.11.1                 # Generar certificado PDF
  printing: ^5.13.1            # Compartir/abrir/“enviar” el PDF
  path_provider: ^2.1.3

  # UI / utilidades
  intl: ^0.19.0                # Formato de moneda y fechas
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0      # Animaciones llamativas
  url_launcher: ^6.3.0
  uuid: ^4.4.0                 # Idempotency-Key / correlation-id

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo-text.png
    - assets/images/full-logo.png
